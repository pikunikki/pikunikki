<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 - pikunikki</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <h1>新規登録</h1>
    <form id="form">
        <label for="username">ユーザー名</label>
        <input type="text" id="username" required>
        <label for="password">パスワード</label>
        <input type="password" id="password" required minlength="4">
        <p class="error" id="error"></p>
        <button class="btn" type="submit">次へ(キャラ選択)</button>
    </form>
    <a class="btn sub" href="login.html">ログインに戻る</a>
</main>
<script src="app.js"></script>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = username.value.trim();
  if (getUsers()[name]) {
    error.textContent = 'そのユーザー名は使われています';
    return;
  }
  // キャラ選択が終わるまで登録は確定しない
  sessionStorage.setItem('pending', JSON.stringify({ name, password: await hash(password.value) }));
  location.href = 'character.html';
});
</script>
</body>
</html>
