<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホーム - pikunikki</title>
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/book.css">
<style>
  /* 交換機能まわりの追加スタイル */
  .exchanged-label { font-size: 0.8rem; opacity: 0.7; margin: 0.25rem 0; }
  .exchange-note { font-size: 0.8rem; opacity: 0.7; margin: 0.25rem 0; }
</style>
</head>
<body>

<!-- 🍫 上部：茶色の帯＋垂れるチョコ -->
<div class="home-header">
  <div class="choco-bar">
    <div class="header-content">
      <img src="image/ピク日記ロゴ.png" alt="ピク日記" class="home-logo">
      <div class="header-actions">
        <a href="mypage.html" class="mypage-btn">マイページ</a>
        <button type="button" class="logout-btn" onclick="logout()">ログアウト</button>
      </div>
    </div>
  </div>
  <svg class="choco-drip" viewBox="0 0 1200 160" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="chocoBody" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="160">
        <stop offset="0"    stop-color="#684a3b"/>
        <stop offset="0.45" stop-color="#5a3a2a"/>
        <stop offset="1"    stop-color="#3a1b0e"/>
      </linearGradient>
      <filter id="soft" x="-10%" y="-50%" width="120%" height="200%">
        <feGaussianBlur stdDeviation="1.5"/>
      </filter>
      <filter id="shadow" x="-5%" y="0%" width="110%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#3a1b0e" flood-opacity="0.35"/>
      </filter>
    </defs>

    <!-- 本体 -->
    <g filter="url(#shadow)">
      <path fill="url(#chocoBody)" d="
        M0,0 L1200,0 L1200,40
        C1170,50 1140,46 1115,40
        C1085,32 1070,45 1060,70
        C1052,95 1018,95 1010,70
        C1000,45 980,32 940,38
        C900,44 875,70 860,100
        C850,125 810,125 800,100
        C790,70 770,44 730,38
        C690,32 665,44 650,68
        C638,92 612,92 600,68
        C580,44 540,32 500,38
        C460,44 435,66 420,92
        C408,115 372,115 360,92
        C348,66 320,44 280,40
        C240,36 205,52 180,78
        C165,95 135,95 120,78
        C100,56 60,48 0,60
        Z"/>
    </g>
    <!-- つや：縁の少し内側をなぞる細い光 -->
    <path d="M1200,34 C1170,44 1140,40 1115,34
            C1085,26 1070,39 1060,64
            C1052,86 1018,86 1010,64
            C1000,39 980,26 940,32
            C900,38 875,64 860,94
            C850,116 810,116 800,94
            C790,64 770,38 730,32
            C690,26 665,38 650,62
            C638,84 612,84 600,62
            C580,38 540,26 500,32
            C460,38 435,60 420,86
            C408,106 372,106 360,86
            C348,60 320,38 280,34
            C240,30 205,46 180,72
            C165,86 135,86 120,72
            C100,50 60,42 0,54"
          fill="none" stroke="#fff" stroke-opacity="0.22"
          stroke-width="2" stroke-linecap="round" filter="url(#soft)"
          vector-effect="non-scaling-stroke"/>
  </svg>
 
</div>

<main>
  <div class="avatar" id="avatar"></div>
  <p id="hello"></p>

  <div class="nav">
  <a class="post-circle" id="post-button" href="post.html" aria-label="日記・写真を投稿">
    <span class="choco-groove"></span>
    <!-- 上からとろっと垂れるチョコ -->
    <svg class="berry-drip" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="btnDrip" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6a3f2a"/>
          <stop offset="1" stop-color="#3a1b0e"/>
        </linearGradient>
      </defs>
      <path fill="url(#btnDrip)" d="M0,0 H100 V30
               C97,30 95,48 88,48 C81,48 80,32 73,32
               C66,32 64,56 56,56 C48,56 47,34 40,34
               C33,34 31,46 24,46 C17,46 15,30 8,30
               C4,30 2,32 0,32 Z"/>
    </svg>
    <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
      <circle class="ring-bg" cx="60" cy="60" r="54"/>
      <circle class="ring-fg" id="ring-fg" cx="60" cy="60" r="54"/>
    </svg>
    <span class="post-plus"></span>
    <span class="choco-shine"></span>
    <span class="post-timer" id="post-timer">--:--:--</span>
  </a>
</div>

<!-- 📅 カレンダー（月ごと） -->
<div class="calendar-container">
  <div class="calendar-nav">
    <button type="button" id="prev-month" aria-label="前の月">‹</button>
    <h2 class="calendar-title" id="calendar-title"></h2>
    <button type="button" id="next-month" aria-label="次の月">›</button>
  </div>
  <div class="calendar-weekdays">
    <div class="sun">日</div><div>月</div><div>火</div><div>水</div>
    <div>木</div><div>金</div><div class="sat">土</div>
  </div>
  <div id="calendar"></div>
  <div id="day-posts"></div>
</div>

<!-- 本 --->
<div id="day-modal" class="day-modal" hidden>
  <div class="book-column">
    <div class="book-page">
      <button id="close-day-modal" class="book-close" type="button">×</button>
      <p id="book-date" class="book-date"></p>
      <div id="book-content"></div>

      <!-- ページの角(左下=前の日 / 右下=次の日)。押すとめくれる -->
      <button id="previous-day" class="page-curl page-curl-prev" type="button" aria-label="前の日" title="前の日"></button>
      <button id="next-day" class="page-curl page-curl-next" type="button" aria-label="次の日" title="次の日"></button>
    </div>

    <div id="book-actions" class="book-actions" hidden>
      <div class="book-action-buttons">
        <button id="share-post" type="button">
          友達と交換する
        </button>
        <button id="doodle-post" class="doodle-btn" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M20.7 2.3a1 1 0 0 0-1.4 0L9.6 12l2.4 2.4 9.7-9.7a1 1 0 0 0 0-1.4z" fill="currentColor"/>
            <path d="M8.2 13.4C6 13.4 4.6 15 4.6 16.8c0 1.2-.7 2-1.6 2.4 2.8 1.2 7.2.6 8.2-2.2.5-1.4-.2-3.6-3-3.6z" fill="currentColor"/>
          </svg>
          落書き
        </button>
      </div>
      <p id="share-message" class="share-message" role="status"></p>
    </div>
  </div>

  <div class="share-side">
    <div id="friend-picker" class="friend-picker" hidden>
      <div class="friend-picker-panel">
        <button id="close-friend-picker" type="button">×</button>
        <h2 id="friend-picker-title">交換する友達を選ぶ</h2>
        <div id="friend-list"></div>
        <p id="friend-message" role="status"></p>
      </div>
    </div>
  </div>
</div>
</main>

<script src="app.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const now = new Date();
  let viewYear = now.getFullYear();
  let viewMonth = now.getMonth();
  const byDate = {};          // 日付 → その日の投稿(+交換申請)
  const postedDays = new Set(); // 自分が投稿した日(交換申請は含めない)
  const keyOf = (y, m, d) => `${y}-${m + 1}-${d}`;

  function renderCalendar() {
    $('calendar-title').textContent = `${viewYear}年${viewMonth + 1}月`;
    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();
    const isThisMonth = viewYear === now.getFullYear() && viewMonth === now.getMonth();

    let html = '';
    for (let i = 0; i < firstDay; i++) html += '<div class="calendar-day empty"></div>';
    for (let d = 1; d <= lastDate; d++) {
      const list = byDate[keyOf(viewYear, viewMonth, d)];
      const withPhoto = list && list.find(p => p.photo);   // その日の最新の写真つき投稿

      let cls = 'calendar-day';
      if (isThisMonth && d === now.getDate()) cls += ' today';
      if (list) cls += ' has-post';
      if (withPhoto) cls += ' has-photo';

      html += `<div class="${cls}" data-day="${d}">`
            + (withPhoto ? `<img src="${withPhoto.photo}" alt="" loading="lazy">` : '')
            + `<span class="day-num">${d}</span></div>`;
    }
    $('calendar').innerHTML = html;
    $('day-posts').innerHTML = '';
  }

  let selectedDay = null;
  let selectedPostId = null;

  // ---- 交換を申し込む(自分の投稿を友達に送る) ----
  function openFriendPicker(postId) {
    selectedPostId = Number(postId);
    if (!selectedPostId) {
      $('share-message').textContent = '交換する投稿がありません';
      return;
    }
    $('friend-picker-title').textContent = '交換する友達を選ぶ';
    $('friend-picker').hidden = false;
    loadFriends();
  }

  function showDay(d) {
    selectedDay = d;

    const date = new Date(viewYear, viewMonth, selectedDay);
    const list = byDate[keyOf(viewYear, viewMonth, selectedDay)] || [];

    $('book-date').textContent =
      `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
    $('share-message').textContent = '';

    const content = $('book-content');
    content.innerHTML = '';

    if (!list.length) {
      const empty = document.createElement('p');
      empty.className = 'book-empty';
      empty.textContent = 'この日の投稿はありません';
      content.appendChild(empty);
    }

    // 承認できるのは、同じ日に自分の(未交換の)投稿がある場合だけ
    const canExchange = list.some(p => !p.isShareRequest && !p.exchanged);

    list.forEach(post => {
      const article = document.createElement('article');
      article.className = 'book-post';

      if (post.photo) {
        const img = document.createElement('img');
        img.src = post.photo;
        img.alt = '';
        article.appendChild(img);
      }

      if (post.isShareRequest) {
        // 交換申請(承認 or 拒否)
        const label = document.createElement('p');
        label.className = 'share-request-label';
        label.textContent = `${post.senderName}さんから交換申請`;
        article.appendChild(label);

        const actions = document.createElement('div');
        actions.className = 'share-request-actions';

        const accept = document.createElement('button');
        accept.type = 'button';
        accept.className = 'accept-share';
        accept.textContent = '交換を承認';
        accept.disabled = !canExchange;
        accept.addEventListener('click', () => {
          if (!confirm('この日の写真と日記が相手のものと入れ替わります。元には戻せません。よろしいですか？')) return;
          try {
            answerShareRequest(post.id, 'accept');
            location.reload();
          } catch (error) {
            $('share-message').textContent = error.message;
          }
        });

        const reject = document.createElement('button');
        reject.type = 'button';
        reject.className = 'reject-share';
        reject.textContent = '拒否';
        reject.addEventListener('click', () => {
          try {
            answerShareRequest(post.id, 'reject');
            location.reload();
          } catch (error) {
            $('share-message').textContent = error.message;
          }
        });

        actions.appendChild(accept);
        actions.appendChild(reject);
        article.appendChild(actions);

        if (!canExchange) {
          const note = document.createElement('p');
          note.className = 'exchange-note';
          note.textContent = 'この日のあなたの投稿がないため、承認できません';
          article.appendChild(note);
        }
      } else {
        // 通常の投稿(交換した日は相手の内容が入っている)
        if (post.exchanged) {
          const ex = document.createElement('p');
          ex.className = 'exchanged-label';
          ex.textContent = `${post.fromName}さんと交換した日`;
          article.appendChild(ex);
        }
        const text = document.createElement('p');
        text.className = 'post-text';
        text.textContent = post.text || '';
        article.appendChild(text);
      }

      content.appendChild(article);
    });

    // 交換できる(自分の・未交換の)投稿がある日だけ「友達と交換する」を出す
    const canShare = list.some(post => !post.isShareRequest && !post.exchanged);
    const canDoodle = list.some(post => !post.isShareRequest && post.photo);
    $('share-post').hidden = !canShare;
    $('doodle-post').hidden = !canDoodle;
    $('book-actions').hidden = !(canShare || canDoodle);
    $('day-modal').hidden = false;
    syncSpine();
  }

  // 背表紙の高さを、ページの実際の高さに合わせる
  function syncSpine() {
    const page = document.querySelector('.book-page');
    document.querySelector('.book-column').style.setProperty('--page-h', page.offsetHeight + 'px');
  }
  window.addEventListener('resize', syncSpine);

  function loadFriends() {
    const result = api('GET', '/api/friends');
    const list = $('friend-list');
    const message = $('friend-message');

    list.innerHTML = '';
    message.textContent = '';

    if (!result.ok) {
      message.textContent =
        result.data?.error || '友達一覧を取得できませんでした';
      return;
    }

    if (!result.data.length) {
      message.textContent = '交換できる友達がいません';
      return;
    }

    result.data.forEach(friend => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = friend.username;
      button.addEventListener('click', () => sharePost(friend.id));
      list.appendChild(button);
    });
  }

  function sharePost(receiverId) {
    if (!selectedPostId) {
      $('friend-message').textContent = '投稿が選択されていません';
      return;
    }

    const result = api(
      'POST',
      `/api/posts/${selectedPostId}/share`,
      { receiverId }
    );

    if (!result.ok) {
      $('friend-message').textContent =
        result.data?.error || '交換に失敗しました';
      return;
    }

    $('friend-picker').hidden = true;
    $('friend-list').innerHTML = '';
    $('friend-message').textContent = '';
    $('share-message').textContent = '交換申請を送りました。相手が同じ日の投稿と交換すると、お互いの写真と日記が入れ替わります';
    selectedPostId = null;
  }

  $('share-post').addEventListener('click', () => {
    const list = byDate[keyOf(viewYear, viewMonth, selectedDay)] || [];
    const target = list.find(p => !p.isShareRequest && !p.exchanged);
    if (!target) {
      $('share-message').textContent = '交換できる投稿がありません';
      return;
    }
    openFriendPicker(target.id);
  });

  // 写真への落書き画面へ(サーバー=投稿ID / デモ=投稿の date で投稿を指定)
  $('doodle-post').addEventListener('click', () => {
    const list = byDate[keyOf(viewYear, viewMonth, selectedDay)] || [];
    const target = list.find(p => !p.isShareRequest && p.photo);
    if (!target) return;
    location.href = 'doodle.html?post=' + encodeURIComponent(target.id ?? new Date(target.date).getTime());
  });

  function moveDay(offset) {
    const date = new Date(viewYear, viewMonth, selectedDay + offset);

    viewYear = date.getFullYear();
    viewMonth = date.getMonth();
    selectedDay = date.getDate();

    renderCalendar();
    showDay(selectedDay);
  }

  // ページをめくる: 背表紙は動かさず、紙(ページの複製)だけをめくる
  let flipping = false;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FLIP_MS = 800;

  // いまのページを見たまま複製する(めくる紙の表になる)
  function snapshotPage() {
    const clone = document.querySelector('.book-page').cloneNode(true);
    clone.removeAttribute('id');
    clone.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
    clone.querySelectorAll('button').forEach(b => { b.tabIndex = -1; });
    clone.setAttribute('aria-hidden', 'true');
    return clone;
  }

  // 紙を作る(withBack=true なら裏面つき。めくれて裏が見える)
  function makeSheet(face, withBack) {
    const page = document.querySelector('.book-page');
    const sheet = document.createElement('div');
    sheet.className = 'page-sheet';
    sheet.style.left = page.offsetLeft + 'px';
    sheet.style.top = page.offsetTop + 'px';
    sheet.style.width = page.offsetWidth + 'px';
    sheet.style.height = page.offsetHeight + 'px';

    const front = document.createElement('div');
    front.className = 'sheet-front';
    front.appendChild(face);
    sheet.appendChild(front);

    if (withBack) {
      const back = document.createElement('div');
      back.className = 'sheet-back';
      sheet.appendChild(back);
    }
    return sheet;
  }

  function flipDay(offset) {
    if (flipping) return;
    if (reduceMotion) { moveDay(offset); return; }
    flipping = true;

    const column = document.querySelector('.book-column');
    const oldFace = snapshotPage();   // めくる前のページ
    moveDay(offset);                  // 下のページは先に新しい日へ切り替える

    const sheets = [];
    if (offset > 0) {
      // 次の日: 今のページがめくれて、下から次のページが現れる
      const turning = makeSheet(oldFace, true);
      turning.classList.add('sheet-next');
      sheets.push(turning);
    } else {
      // 前の日: 今のページの上に、前のページがめくれて戻ってくる
      const under = makeSheet(oldFace, false);
      under.classList.add('sheet-under');
      const turning = makeSheet(snapshotPage(), true);
      turning.classList.add('sheet-prev');
      sheets.push(under, turning);
    }
    sheets.forEach(s => column.appendChild(s));

    setTimeout(() => {
      sheets.forEach(s => s.remove());
      flipping = false;
    }, FLIP_MS + 40);
  }

  $('previous-day').addEventListener('click', () => flipDay(-1));
  $('next-day').addEventListener('click', () => flipDay(1));

  // キーボードの ← → でもめくれる
  document.addEventListener('keydown', e => {
    if ($('day-modal').hidden || !$('friend-picker').hidden) return;
    if (e.key === 'ArrowLeft') flipDay(-1);
    if (e.key === 'ArrowRight') flipDay(1);
  });

  $('close-day-modal').addEventListener('click', () => {
    $('day-modal').hidden = true;
  });

  $('close-friend-picker').addEventListener('click', () => {
    $('friend-picker').hidden = true;
    $('friend-list').innerHTML = '';
    $('friend-message').textContent = '';
  });

  $('day-modal').addEventListener('click', e => {
    if (e.target === $('day-modal')) {
      $('day-modal').hidden = true;
    }
  });

  function changeMonth(diff) {
    viewMonth += diff;
    if (viewMonth < 0)  { viewMonth = 11; viewYear--; }
    if (viewMonth > 11) { viewMonth = 0;  viewYear++; }
    renderCalendar();
  }

  // ① まずカレンダーを描く（APIが失敗しても表示される）
  $('prev-month').addEventListener('click', () => changeMonth(-1));
  $('next-month').addEventListener('click', () => changeMonth(1));
  $('calendar').addEventListener('click', e => {
    const el = e.target.closest('.calendar-day[data-day]');
    if (el) showDay(Number(el.dataset.day));
  });
  renderCalendar();

  // ⏱ 投稿ボタンのタイマー(今日の投稿まで、あと何時間か)
  const DAY_MS = 24 * 60 * 60 * 1000;
  const CIRC = 2 * Math.PI * 54;
  const postButton = $('post-button');

  function tickTimer() {
    const timerEl = $('post-timer');
    const ring = $('ring-fg');
    const t = new Date();
    // 交換申請ではなく、自分の投稿があるかで判定する
    const hasPostedToday = postedDays.has(keyOf(t.getFullYear(), t.getMonth(), t.getDate()));

    // 今日すでに投稿していたら「投稿済み」
    if (hasPostedToday) {
      timerEl.textContent = '投稿済み';
      ring.style.strokeDashoffset = 0;
      postButton.setAttribute('aria-disabled', 'true');
      return;
    }

    postButton.removeAttribute('aria-disabled');

    // まだなら、今日の終わり(次の0:00)までのカウントダウン
    const end = new Date();
    end.setHours(24, 0, 0, 0);
    const left = Math.max(0, end - t);
    const h = String(Math.floor(left / 3600000)).padStart(2, '0');
    const m = String(Math.floor(left / 60000) % 60).padStart(2, '0');
    const s = String(Math.floor(left / 1000) % 60).padStart(2, '0');
    timerEl.textContent = `${h}:${m}:${s}`;
    ring.style.strokeDashoffset = CIRC * (1 - left / DAY_MS);
  }
  tickTimer();
  setInterval(tickTimer, 1000);
  $('post-button').addEventListener('click', (e) => {
    if (postButton.getAttribute('aria-disabled') === 'true') e.preventDefault();
  });

  // ② ログイン情報と投稿を読み込む
  (async function load() {
    try {
      // app.js 経由で取得(バックエンド無しのデモモードでも動く)
      const me = window.me();
      if (!me) { location.href = 'login.html'; return; }

      const posts = getPosts();
      const shareRequests = getShareRequests();

      posts.forEach(p => {
        const dt = new Date(p.date);
        postedDays.add(keyOf(dt.getFullYear(), dt.getMonth(), dt.getDate()));
      });

      [...posts, ...shareRequests].forEach(p => {
        const dt = new Date(p.date);
        const k = keyOf(dt.getFullYear(), dt.getMonth(), dt.getDate());
        (byDate[k] = byDate[k] || []).push(p);
      });
      renderCalendar(); // 投稿の印を反映
      tickTimer(); // 投稿済みかどうかを反映
    } catch (e) {
      $('hello').textContent = '読み込みエラー: ' + e.message;
      console.error(e);
    }
  })();
})();
</script>
</body>
</html>
