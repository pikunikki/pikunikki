<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ピク日記 - マイページ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/mypage.css">
</head>
<body>

  <div class="home-header">
    <div class="choco-bar">
      <div class="header-content">
        <a class="site-header-btn" href="home.html">ホーム</a>
      </div>
    </div>
    <svg class="choco-drip" viewBox="0 0 1200 160" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="mypageChocoBody" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="160"><stop offset="0" stop-color="#684a3b"/><stop offset="0.45" stop-color="#5a3a2a"/><stop offset="1" stop-color="#3a1b0e"/></linearGradient><filter id="mypageSoft" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter><filter id="mypageShadow" x="-5%" y="0%" width="110%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#3a1b0e" flood-opacity="0.35"/></filter></defs>
      <g filter="url(#mypageShadow)"><path fill="url(#mypageChocoBody)" d="M0,0 L1200,0 L1200,40 C1170,50 1140,46 1115,40 C1085,32 1070,45 1060,70 C1052,95 1018,95 1010,70 C1000,45 980,32 940,38 C900,44 875,70 860,100 C850,125 810,125 800,100 C790,70 770,44 730,38 C690,32 665,44 650,68 C638,92 612,92 600,68 C580,44 540,32 500,38 C460,44 435,66 420,92 C408,115 372,115 360,92 C348,66 320,44 280,40 C240,36 205,52 180,78 C165,95 135,95 120,78 C100,56 60,48 0,60 Z"/></g>
      <path d="M1200,34 C1170,44 1140,40 1115,34 C1085,26 1070,39 1060,64 C1052,86 1018,86 1010,64 C1000,39 980,26 940,32 C900,38 875,64 860,94 C850,116 810,116 800,94 C790,64 770,38 730,32 C690,26 665,38 650,62 C638,84 612,84 600,62 C580,38 540,26 500,32 C460,38 435,60 420,86 C408,106 372,106 360,86 C348,60 320,38 280,34 C240,30 205,46 180,72 C165,86 135,86 120,72 C100,50 60,42 0,54" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round" filter="url(#mypageSoft)" vector-effect="non-scaling-stroke"/>
    </svg>
  </div>

  <!-- メインレイアウト -->
  <main>
    <!-- 左カラム -->
    <div class="column">
      <!-- プロフィール -->
      <section class="card profile-card">
        <h2 class="card-title">プロフィール</h2>
        <div class="avatar-wrapper">🍓</div>
        <div class="user-name">なな</div>
        <div class="user-id">ID : nouin1033</div>
        <div class="profile-btns">
          <button class="btn">プロフィール編集</button>
          <button class="btn">設定</button>
        </div>
      </section>

      <!-- カレンダー -->
      <section class="card">
        <h2 class="card-title">カレンダー</h2>
        <div class="calendar-grid">
          <div class="day-name">日</div><div class="day-name">月</div><div class="day-name">火</div>
          <div class="day-name">水</div><div class="day-name">木</div><div class="day-name">金</div><div class="day-name">土</div>
          
          <div class="day-cell"></div><div class="day-cell"></div><div class="day-cell"></div>
          <div class="day-cell active">1</div><div class="day-cell active">2</div><div class="day-cell active">3</div><div class="day-cell">4</div>
          <div class="day-cell active">5</div><div class="day-cell active">6</div><div class="day-cell">7</div><div class="day-cell active">8</div>
          <div class="day-cell active">9</div><div class="day-cell active">10</div><div class="day-cell">11</div>
        </div>
      </section>
    </div>

    <!-- 右カラム -->
    <div class="column">
      <!-- 最近の投稿 -->
      <section class="card">
        <h2 class="card-title">最近の投稿</h2>
        <div class="posts-grid">
          <div class="post-item">
            <div class="post-img">🌳</div>
            <div class="post-title">昨日の遠足</div>
            <div class="post-stars">★★★★★</div>
          </div>
          <div class="post-item">
            <div class="post-img">🍱</div>
            <div class="post-title">料理で食べる</div>
            <div class="post-stars">★★★★★</div>
          </div>
          <div class="post-item">
            <div class="post-img">🍪</div>
            <div class="post-title">クッキー作り</div>
            <div class="post-stars">★★★★★</div>
          </div>
          <div class="post-item">
            <div class="post-img">😴</div>
            <div class="post-title">お昼寝</div>
            <div class="post-stars">★★★★★</div>
          </div>
        </div>
      </section>

      <!-- 友達 -->
      <section class="card">
        <h2 class="card-title">友達</h2>
        <div class="friends-list">
          <div class="friend-item">
            <div class="friend-avatar">👧</div>
            <div>
              <div class="friend-info">なな</div>
              <div class="friend-status">友達・近況</div>
            </div>
          </div>
          <div class="friend-item">
            <div class="friend-avatar">👩</div>
            <div>
              <div class="friend-info">日本さん</div>
              <div class="friend-status">状態</div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- ボトムナビゲーション -->
  <nav class="bottom-nav">
    <button class="nav-item active">
      <span>📷</span>
      <span>ホーム</span>
    </button>
    <button class="nav-item">
      <span>📖</span>
      <span>日記一覧</span>
    </button>
    <button class="nav-item">
      <span>🍰</span>
      <span>新しい日記を書く</span>
    </button>
  </nav>

</body>
</html>
