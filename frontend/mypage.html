<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ピク日記 - マイページ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/mypage.css">
</head>
<body>

  <div class="home-header">
    <div class="choco-bar">
      <div class="header-content">
        <div class="header-actions">
          <a class="site-header-btn" href="home.html">ホーム</a>
          <button type="button" class="logout-btn" onclick="logout()">ログアウト</button>
        </div>
      </div>
    </div>
    <svg class="choco-drip" viewBox="0 0 1200 160" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="mypageChocoBody" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="160"><stop offset="0" stop-color="#684a3b"/><stop offset="0.45" stop-color="#5a3a2a"/><stop offset="1" stop-color="#3a1b0e"/></linearGradient><filter id="mypageSoft" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter><filter id="mypageShadow" x="-5%" y="0%" width="110%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#3a1b0e" flood-opacity="0.35"/></filter></defs>
      <g filter="url(#mypageShadow)"><path fill="url(#mypageChocoBody)" d="M0,0 L1200,0 L1200,40 C1170,50 1140,46 1115,40 C1085,32 1070,45 1060,70 C1052,95 1018,95 1010,70 C1000,45 980,32 940,38 C900,44 875,70 860,100 C850,125 810,125 800,100 C790,70 770,44 730,38 C690,32 665,44 650,68 C638,92 612,92 600,68 C580,44 540,32 500,38 C460,44 435,66 420,92 C408,115 372,115 360,92 C348,66 320,44 280,40 C240,36 205,52 180,78 C165,95 135,95 120,78 C100,56 60,48 0,60 Z"/></g>
      <path d="M1200,34 C1170,44 1140,40 1115,34 C1085,26 1070,39 1060,64 C1052,86 1018,86 1010,64 C1000,39 980,26 940,32 C900,38 875,64 860,94 C850,116 810,116 800,94 C790,64 770,38 730,32 C690,26 665,38 650,62 C638,84 612,84 600,62 C580,38 540,26 500,32 C460,38 435,60 420,86 C408,106 372,106 360,86 C348,60 320,38 280,34 C240,30 205,46 180,72 C165,86 135,86 120,72 C100,50 60,42 0,54" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round" filter="url(#mypageSoft)" vector-effect="non-scaling-stroke"/>
    </svg>
  </div>

  <main>
    <!-- プロフィール(キャラ表示・名前・キャラ変更) -->
    <section class="card profile-card">
      <div class="avatar" id="avatar"><img id="avatar-img" alt=""></div>
      <div class="profile-body">
        <div class="name-row"><span class="name-label">name :</span><span class="user-name" id="user-name"></span></div>
        <div class="user-id">ID : <span id="user-id"></span></div>
        <svg class="name-drip" viewBox="0 0 300 26" preserveAspectRatio="none" aria-hidden="true"><path fill="#684a3b" d="M0,0 H300 V6 C285,6 282,22 270,22 C258,22 255,6 240,6 C225,6 222,18 210,18 C198,18 195,6 180,6 C165,6 162,24 150,24 C138,24 135,6 120,6 C105,6 102,16 90,16 C78,16 75,6 60,6 C45,6 42,20 30,20 C18,20 15,6 0,6 Z"/></svg>
        <div class="change-title">キャラ変更</div>
        <div class="char-row" id="char-row"></div>
        <p class="msg" id="char-msg" role="status"></p>
      </div>
    </section>

    <!-- 友達 -->
    <section class="card friends-card">
      <div class="friends-head">
        <h2 class="card-title">友達</h2>
        <button type="button" class="pill-btn" id="add-friend-btn" aria-expanded="false">友達追加</button>
      </div>

      <div class="panel" id="add-panel" hidden>
        <form class="search-form" id="search-form">
          <label class="sr-only" for="search-keyword">ID</label>
          <input type="text" id="search-keyword" placeholder="IDで探す(例: pikuchan_01)" autocomplete="off" autocapitalize="off">
          <button type="submit" class="pill-btn">検索</button>
        </form>
        <ul class="people" id="search-results"></ul>
        <p class="msg" id="search-msg" role="status"></p>
      </div>

      <ul class="people" id="friends-list"></ul>
      <p class="empty" id="friends-empty" hidden>まだ友達がいません。「友達追加」から探してみよう。</p>
    </section>

    <!-- 申請(友達申請が届いているときだけ表示) -->
    <section class="card requests-card" id="requests-panel" hidden>
      <h2 class="card-title">申請</h2>
      <ul class="people" id="requests-list"></ul>
      <p class="msg" id="requests-msg" role="status"></p>
    </section>
  </main>

<script src="app.js"></script>
<script>
requireLogin();
const $ = (id) => document.getElementById(id);

const avatarOf = (id) => {
  const c = getCharacter(id);
  return c ? `<img src="${c.image}" alt="">` : '';
};

function showMe() {
  const user = me();
  if (!user) return;
  $('user-name').textContent = user.username;
  $('user-id').textContent = user.userId;
  const c = getCharacter(user.character);
  $('avatar-img').src = c ? c.image : '';
  $('avatar').dataset.id = user.character;
  document.querySelectorAll('#char-row .char-opt').forEach((el) => el.classList.toggle('current', el.dataset.id === user.character));
}

// ---- キャラ変更 ----
CHARACTERS.forEach((c) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'char-opt';
  b.dataset.id = c.id;
  b.innerHTML = `<img src="${c.card}" alt="${c.name}">`;
  b.onclick = () => {
    try { setCharacter(c.id); } catch (e) { $('char-msg').textContent = e.message; return; }
    $('char-msg').textContent = `${c.name}に変更しました`;
    showMe();
  };
  $('char-row').appendChild(b);
});

// ---- 友達 ----
const personHtml = (p, actions = '') =>
  `<li class="person"><span class="person-avatar">${avatarOf(p.character)}</span><span class="person-name">${escapeHtml(p.username)}<small class="person-id">@${escapeHtml(p.userId || '')}</small></span>${actions}</li>`;

function renderFriends() {
  const friends = getFriends();
  $('friends-list').innerHTML = friends.map((f) => personHtml(f)).join('');
  $('friends-empty').hidden = friends.length > 0;
}

function renderRequests() {
  const reqs = getFriendRequests();
  $('requests-panel').hidden = reqs.length === 0;
  $('requests-list').innerHTML = reqs.map((r) => personHtml(r,
    `<span class="person-actions"><button type="button" class="pill-btn" data-accept="${r.id}">承認</button><button type="button" class="pill-btn sub" data-reject="${r.id}">拒否</button></span>`)).join('');
}

$('requests-list').addEventListener('click', (e) => {
  const accept = e.target.dataset.accept;
  const reject = e.target.dataset.reject;
  const id = Number(accept || reject);
  if (!id) return;
  try { answerFriendRequest(id, Boolean(accept)); } catch (err) { $('requests-msg').textContent = err.message; return; }
  $('requests-msg').textContent = '';
  renderRequests();
  renderFriends();
});

$('add-friend-btn').onclick = () => {
  const open = $('add-panel').hidden;
  $('add-panel').hidden = !open;
  $('add-friend-btn').setAttribute('aria-expanded', String(open));
  if (open) $('search-keyword').focus();
};

$('search-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const keyword = $('search-keyword').value.trim();
  $('search-msg').textContent = '';
  if (!keyword) { $('search-results').innerHTML = ''; return; }
  const found = searchUsers(keyword);
  $('search-results').innerHTML = found.map((u) =>
    personHtml(u, `<span class="person-actions"><button type="button" class="pill-btn" data-send="${u.id}">申請する</button></span>`)).join('');
  if (!found.length) $('search-msg').textContent = 'そのIDのユーザーは見つかりませんでした';
});

$('search-results').addEventListener('click', (e) => {
  const id = Number(e.target.dataset.send);
  if (!id) return;
  try {
    sendFriendRequest(id);
    e.target.textContent = '申請済み';
    e.target.disabled = true;
    $('search-msg').textContent = '友達申請を送りました';
  } catch (err) {
    $('search-msg').textContent = err.message;
  }
});

showMe();
renderRequests();
renderFriends();
</script>
</body>
</html>
