<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>落書き - pikunikki</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/post.css">
    <link rel="stylesheet" href="css/doodle.css">
    <script src="theme.js"></script>
</head>

<body class="post-body doodle-body">

     <div class="home-header">
    <div class="choco-bar">
      <div class="header-content">
        <div class="header-actions">
          <a class="site-header-btn" href="home.html">ホーム</a>
          <button type="button" class="logout-btn" onclick="logout()">ログアウト</button>
        </div>
      </div>
    </div>
    <svg class="choco-drip" viewBox="0 0 1200 160" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="mypageChocoBody" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="160"><stop offset="0" stop-color="#684a3b"/><stop offset="0.45" stop-color="#5a3a2a"/><stop offset="1" stop-color="#3a1b0e"/></linearGradient><filter id="mypageSoft" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter><filter id="mypageShadow" x="-5%" y="0%" width="110%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#3a1b0e" flood-opacity="0.35"/></filter></defs>
      <g filter="url(#mypageShadow)"><path fill="url(#mypageChocoBody)" d="M0,0 L1200,0 L1200,40 C1170,50 1140,46 1115,40 C1085,32 1070,45 1060,70 C1052,95 1018,95 1010,70 C1000,45 980,32 940,38 C900,44 875,70 860,100 C850,125 810,125 800,100 C790,70 770,44 730,38 C690,32 665,44 650,68 C638,92 612,92 600,68 C580,44 540,32 500,38 C460,44 435,66 420,92 C408,115 372,115 360,92 C348,66 320,44 280,40 C240,36 205,52 180,78 C165,95 135,95 120,78 C100,56 60,48 0,60 Z"/></g>
      <path d="M1200,34 C1170,44 1140,40 1115,34 C1085,26 1070,39 1060,64 C1052,86 1018,86 1010,64 C1000,39 980,26 940,32 C900,38 875,64 860,94 C850,116 810,116 800,94 C790,64 770,38 730,32 C690,26 665,38 650,62 C638,84 612,84 600,62 C580,38 540,26 500,32 C460,38 435,60 420,86 C408,106 372,106 360,86 C348,60 320,38 280,34 C240,30 205,46 180,72 C165,86 135,86 120,72 C100,50 60,42 0,54" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round" filter="url(#mypageSoft)" vector-effect="non-scaling-stroke"/>
    </svg>
  </div>
  <div class="heart-container" aria-hidden="true">
        <span class="heart heart-red h-1">♡</span>
        <span class="heart heart-blue h-2">♡</span>
        <span class="heart heart-pink h-3">♥</span>
        <span class="heart heart-yellow h-4">♡</span>
        <span class="heart heart-red h-5">♥</span>
        <span class="heart heart-blue h-6">♡</span>
        <span class="heart heart-pink h-7">♡</span>
        <span class="heart heart-yellow h-8">♥</span>
        <span class="heart heart-red h-9">♡</span>
        <span class="heart heart-blue h-10">♥</span>
    </div>
    <!-- 落書き画面 -->
    <main class="doodle-page">
        <h1>写真に落書き</h1>

        <div class="doodle-card">
            <div class="doodle-main">
                <div class="canvas-wrap">
                    <canvas id="doodle-canvas" aria-label="落書きする写真"></canvas>
                    <p id="doodle-status" class="doodle-status">写真を読み込み中…</p>
                </div>

                <!-- 右側のスペース(カラーパレット / スタンプ) -->
                <aside class="doodle-side" id="doodle-side">
                    <section class="side-panel" id="panel-color">
                        <h2>カラーパレット</h2>
                        <div class="color-picker" id="color-picker">
                            <canvas id="hue-ring" width="200" height="200"></canvas>
                            <canvas id="sv-box" width="100" height="100"></canvas>
                            <span class="knob" id="hue-knob"></span>
                            <span class="knob" id="sv-knob"></span>
                        </div>
                        <div class="swatches">
                            <figure>
                                <span class="swatch" id="swatch-now"></span>
                                <figcaption>いまの色</figcaption>
                            </figure>
                            <figure>
                                <button type="button" class="swatch" id="swatch-old" title="もとの色に戻す"></button>
                                <figcaption>もとの色</figcaption>
                            </figure>
                        </div>
                    </section>

                    <section class="side-panel" id="panel-stamp" hidden>
                        <h2>スタンプ</h2>
                        <div class="stamp-grid" id="stamp-grid"></div>
                    </section>

                    <section class="side-panel side-size">
                        <div class="size-head">
                            <label for="size" id="size-label">ふとさ</label>
                            <span class="size-value" id="size-value">8px</span>
                        </div>
                        <div class="size-preview-box">
                            <canvas id="size-preview" width="200" height="88" aria-hidden="true"></canvas>
                        </div>
                        <input type="range" id="size" min="1" max="60" value="8">
                    </section>
                </aside>
            </div>

            <!-- ツールバー -->
            <div class="toolbar">
                <div class="tool-group">
                    <button type="button" class="tool-btn" id="undo" title="もとに戻す" aria-label="もとに戻す" disabled>
                        <svg viewBox="0 0 24 24"><path d="M9 7H4V2M4 7c2-3 5-4.5 8.5-4.5A8.5 8.5 0 1 1 4.6 14"/></svg>
                    </button>
                    <button type="button" class="tool-btn" id="redo" title="やり直す" aria-label="やり直す" disabled>
                        <svg viewBox="0 0 24 24"><path d="M15 7h5V2M20 7c-2-3-5-4.5-8.5-4.5A8.5 8.5 0 1 0 19.4 14"/></svg>
                    </button>
                </div>

                <div class="tool-group" id="tools">
                    <button type="button" class="tool-btn active" data-tool="pen" title="ペン" aria-label="ペン">
                        <svg viewBox="0 0 24 24"><path d="M4 20l1-5L16 4l4 4L9 19z M14 6l4 4"/></svg>
                    </button>
                    <button type="button" class="tool-btn" data-tool="marker" title="マーカー" aria-label="マーカー">
                        <svg viewBox="0 0 24 24"><path d="M6 17l-2 4h6l1-2 M7 15l9-11 4 3-9 11-4 1z"/><path class="fill-color" d="M3 22h18" /></svg>
                    </button>
                    <button type="button" class="tool-btn" data-tool="pencil" title="エンピツ" aria-label="エンピツ">
                        <svg viewBox="0 0 24 24"><path d="M15 3l6 6L9 21H3v-6z M3 15l6 6 M13 5l6 6"/></svg>
                    </button>
                    <button type="button" class="tool-btn" data-tool="eraser" title="ケシゴム" aria-label="ケシゴム">
                        <svg viewBox="0 0 24 24"><path d="M8 20h12 M4 15l9-11 7 6-8 10H8z M9 9l6 6"/></svg>
                    </button>
                    <button type="button" class="tool-btn color-btn" id="color-btn" data-panel="color" title="カラーパレット" aria-label="カラーパレット">
                        <span class="color-dot" id="color-dot"></span>
                    </button>
                    <button type="button" class="tool-btn" data-tool="stamp" data-panel="stamp" title="スタンプ" aria-label="スタンプ">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14c1 2 2.5 3 4 3s3-1 4-3"/><path d="M9 9.5v.5M15 9.5v.5"/></svg>
                    </button>
                </div>
            </div>

            <div class="toolbar">
                <div class="tool-group style-group" id="styles">
                    <button type="button" class="style-btn active" data-style="normal">
                        <svg viewBox="0 0 48 20"><path d="M3 15c8-14 14 4 22-6s12-4 20-6"/></svg>
                        <span>ノーマル</span>
                    </button>
                    <button type="button" class="style-btn" data-style="outline">
                        <svg viewBox="0 0 48 20"><path class="st-outer" d="M3 15c8-14 14 4 22-6s12-4 20-6"/><path class="st-inner" d="M3 15c8-14 14 4 22-6s12-4 20-6"/></svg>
                        <span>ふちあり</span>
                    </button>
                    <button type="button" class="style-btn" data-style="shadow">
                        <svg viewBox="0 0 48 20"><path class="st-shadow" d="M5 18c8-14 14 4 22-6s12-4 20-6"/><path d="M3 15c8-14 14 4 22-6s12-4 20-6"/></svg>
                        <span>かげあり</span>
                    </button>
                    <button type="button" class="style-btn" data-style="sparkle">
                        <svg viewBox="0 0 48 20"><path d="M3 15c8-14 14 4 22-6s12-4 20-6"/><path class="st-spark" d="M12 3v4M10 5h4M36 13v4M34 15h4"/></svg>
                        <span>キラキラ</span>
                    </button>
                </div>
            </div>

            <div class="doodle-footer">
                <p class="error" id="doodle-error" role="status"></p>
                <a class="doodle-cancel" href="home.html">やめる</a>
                <button type="button" class="doodle-save" id="save" disabled>保存</button>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
    <script src="doodle.js"></script>
</body>
</html>
