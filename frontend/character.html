<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャラ選択 - pikunikki</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="character-page">
<div class="home-header">
  <div class="choco-bar">
    <div class="header-content">
      <a class="site-header-btn" href="signup.html">新規登録に戻る</a>
    </div>
  </div>
  <svg class="choco-drip" viewBox="0 0 1200 160" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="characterChocoBody" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="160"><stop offset="0" stop-color="#684a3b"/><stop offset="0.45" stop-color="#5a3a2a"/><stop offset="1" stop-color="#3a1b0e"/></linearGradient><filter id="characterSoft" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter><filter id="characterShadow" x="-5%" y="0%" width="110%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#3a1b0e" flood-opacity="0.35"/></filter></defs>
    <g filter="url(#characterShadow)"><path fill="url(#characterChocoBody)" d="M0,0 L1200,0 L1200,40 C1170,50 1140,46 1115,40 C1085,32 1070,45 1060,70 C1052,95 1018,95 1010,70 C1000,45 980,32 940,38 C900,44 875,70 860,100 C850,125 810,125 800,100 C790,70 770,44 730,38 C690,32 665,44 650,68 C638,92 612,92 600,68 C580,44 540,32 500,38 C460,44 435,66 420,92 C408,115 372,115 360,92 C348,66 320,44 280,40 C240,36 205,52 180,78 C165,95 135,95 120,78 C100,56 60,48 0,60 Z"/></g>
    <path d="M1200,34 C1170,44 1140,40 1115,34 C1085,26 1070,39 1060,64 C1052,86 1018,86 1010,64 C1000,39 980,26 940,32 C900,38 875,64 860,94 C850,116 810,116 800,94 C790,64 770,38 730,32 C690,26 665,38 650,62 C638,84 612,84 600,62 C580,38 540,26 500,32 C460,38 435,60 420,86 C408,106 372,106 360,86 C348,60 320,38 280,34 C240,30 205,46 180,72 C165,86 135,86 120,72 C100,50 60,42 0,54" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round" filter="url(#characterSoft)" vector-effect="non-scaling-stroke"/>
  </svg>
</div>
<main>
    <h1>キャラクターを選ぼう</h1>
    <div class="chars" id="chars"></div>
    <p class="error" id="error"></p>
    <button class="btn" id="ok">これに決定</button>
</main>
<script src="app.js"></script>
<script>
const pending = JSON.parse(sessionStorage.getItem('pending') || 'null');
if (!pending) location.replace('signup.html');
let selected = null;
const box = document.getElementById('chars');
CHARACTERS.forEach((c) => {
  const el = document.createElement('div');
  el.className = 'char';
  el.innerHTML = `<img src="${c.card}" alt="${c.name}">`;
  el.onclick = () => {
    selected = c.id;
    box.querySelectorAll('.char').forEach((x) => x.classList.remove('selected'));
    el.classList.add('selected');
  };
  box.appendChild(el);
});
document.getElementById('ok').onclick = () => {
  if (!selected) { error.textContent = 'キャラクターを選んでください'; return; }
  const users = getUsers();
  users[pending.name] = { password: pending.password, character: selected, createdAt: Date.now() };
  save('users', users);
  sessionStorage.removeItem('pending');
  setCurrentName(pending.name);
  location.href = 'home.html';
};
</script>
</body>
</html>
