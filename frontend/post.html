<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投稿 - pikunikki</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/post.css">
    <script src="theme.js"></script>
</head>

<body class="post-body">

     <div class="home-header">
    <div class="choco-bar">
      <div class="header-content">
        <div class="header-actions">
          <a class="site-header-btn" href="home.html">ホーム</a>
          <button type="button" class="logout-btn" onclick="logout()">ログアウト</button>
        </div>
      </div>
    </div>
    <svg class="choco-drip" viewBox="0 0 1200 160" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="mypageChocoBody" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="160"><stop offset="0" stop-color="#684a3b"/><stop offset="0.45" stop-color="#5a3a2a"/><stop offset="1" stop-color="#3a1b0e"/></linearGradient><filter id="mypageSoft" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter><filter id="mypageShadow" x="-5%" y="0%" width="110%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#3a1b0e" flood-opacity="0.35"/></filter></defs>
      <g filter="url(#mypageShadow)"><path fill="url(#mypageChocoBody)" d="M0,0 L1200,0 L1200,40 C1170,50 1140,46 1115,40 C1085,32 1070,45 1060,70 C1052,95 1018,95 1010,70 C1000,45 980,32 940,38 C900,44 875,70 860,100 C850,125 810,125 800,100 C790,70 770,44 730,38 C690,32 665,44 650,68 C638,92 612,92 600,68 C580,44 540,32 500,38 C460,44 435,66 420,92 C408,115 372,115 360,92 C348,66 320,44 280,40 C240,36 205,52 180,78 C165,95 135,95 120,78 C100,56 60,48 0,60 Z"/></g>
      <path d="M1200,34 C1170,44 1140,40 1115,34 C1085,26 1070,39 1060,64 C1052,86 1018,86 1010,64 C1000,39 980,26 940,32 C900,38 875,64 860,94 C850,116 810,116 800,94 C790,64 770,38 730,32 C690,26 665,38 650,62 C638,84 612,84 600,62 C580,38 540,26 500,32 C460,38 435,60 420,86 C408,106 372,106 360,86 C348,60 320,38 280,34 C240,30 205,46 180,72 C165,86 135,86 120,72 C100,50 60,42 0,54" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round" filter="url(#mypageSoft)" vector-effect="non-scaling-stroke"/>
    </svg>
  </div>
  <div class="heart-container" aria-hidden="true">
        <span class="heart heart-red h-1">♡</span>
        <span class="heart heart-blue h-2">♡</span>
        <span class="heart heart-pink h-3">♥</span>
        <span class="heart heart-yellow h-4">♡</span>
        <span class="heart heart-red h-5">♥</span>
        <span class="heart heart-blue h-6">♡</span>
        <span class="heart heart-pink h-7">♡</span>
        <span class="heart heart-yellow h-8">♥</span>
        <span class="heart heart-red h-9">♡</span>
        <span class="heart heart-blue h-10">♥</span>
    </div>
    <!-- 投稿画面 -->
    <main class="post-page">

        <h1>写真・日記を投稿</h1>

        <form id="form">

            <label class="upload-area" for="photo">
                <input type="file" id="photo" accept="image/*">

                <div class="upload-content" id="upload-content">
                    <svg viewBox="0 0 100 100" class="upload-icon">
                        <path d="M20 40 V85 H80 V40"
                            fill="none" stroke="currentColor"
                            stroke-width="3" stroke-linejoin="round"/>
                        <path d="M50 65 V12 M32 30 L50 12 L68 30"
                            fill="none" stroke="currentColor"
                            stroke-width="3" stroke-linecap="round"
                            stroke-linejoin="round"/>
                    </svg>
                    <p>写真をアップしてね。</p>
                </div>

                <img id="preview" alt="写真プレビュー">
            </label>

            <label for="text" class="diary-label">日記</label>

            <textarea id="text"
                placeholder="今日のできごとを書いてね..."
                required></textarea>

            <p class="error" id="error"></p>

            <button class="btn post-submit"
                id="submit-button" type="submit">
                投稿する
            </button>
        </form>

    </main>

    <script src="app.js"></script>
    <script>
        requireLogin();

        let photoData = null;

        function shrink(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();

                img.onload = () => {
                    const scale = Math.min(
                        1, 800 / Math.max(img.width, img.height)
                    );

                    const cv = document.createElement('canvas');
                    cv.width = img.width * scale;
                    cv.height = img.height * scale;

                    cv.getContext('2d').drawImage(
                        img, 0, 0, cv.width, cv.height
                    );

                    URL.revokeObjectURL(img.src);
                    resolve(cv.toDataURL('image/jpeg', 0.7));
                };

                img.onerror = reject;
                img.src = URL.createObjectURL(file);
            });
        }

        photo.addEventListener('change', async () => {
            const file = photo.files[0];

            if (!file) {
                photoData = null;
                preview.style.display = 'none';
                uploadContent.style.display = 'flex';
                return;
            }

            try {
                photoData = await shrink(file);
                preview.src = photoData;
                preview.style.display = 'block';
                uploadContent.style.display = 'none';
            } catch {
                error.textContent = '画像を読み込めませんでした';
            }
        });

        const submitButton = document.getElementById('submit-button');
        let isSubmitting = false;

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            if (isSubmitting) return;

            isSubmitting = true;
            submitButton.disabled = true;

            try {
                addPost({
                    user: getCurrentName(),
                    text: text.value,
                    photo: photoData,
                    date: Date.now()
                });
            } catch {
                isSubmitting = false;
                submitButton.disabled = false;
                error.textContent =
                    '保存に失敗しました（容量オーバーの可能性）';
                return;
            }

            location.href = 'home.html';
        });
    </script>

</body>
</html>
