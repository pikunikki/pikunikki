<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投稿 - pikunikki</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="home-header">
  <div class="choco-bar">
    <div class="header-content">
      <div class="header-actions">
        <a class="mypage-btn" href="mypage.html">マイページ</a>
        <button type="button" class="logout-btn" onclick="logout()">ログアウト</button>
      </div>
    </div>
  </div>
  <svg class="choco-drip" viewBox="0 0 1200 160" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="postChocoBody" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="160">
        <stop offset="0" stop-color="#684a3b"/>
        <stop offset="0.45" stop-color="#5a3a2a"/>
        <stop offset="1" stop-color="#3a1b0e"/>
      </linearGradient>
      <filter id="postSoft" x="-10%" y="-50%" width="120%" height="200%">
        <feGaussianBlur stdDeviation="1.5"/>
      </filter>
      <filter id="postShadow" x="-5%" y="0%" width="110%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#3a1b0e" flood-opacity="0.35"/>
      </filter>
    </defs>
    <g filter="url(#postShadow)">
      <path fill="url(#postChocoBody)" d="M0,0 L1200,0 L1200,40 C1170,50 1140,46 1115,40 C1085,32 1070,45 1060,70 C1052,95 1018,95 1010,70 C1000,45 980,32 940,38 C900,44 875,70 860,100 C850,125 810,125 800,100 C790,70 770,44 730,38 C690,32 665,44 650,68 C638,92 612,92 600,68 C580,44 540,32 500,38 C460,44 435,66 420,92 C408,115 372,115 360,92 C348,66 320,44 280,40 C240,36 205,52 180,78 C165,95 135,95 120,78 C100,56 60,48 0,60 Z"/>
    </g>
    <path d="M1200,34 C1170,44 1140,40 1115,34 C1085,26 1070,39 1060,64 C1052,86 1018,86 1010,64 C1000,39 980,26 940,32 C900,38 875,64 860,94 C850,116 810,116 800,94 C790,64 770,38 730,32 C690,26 665,38 650,62 C638,84 612,84 600,62 C580,38 540,26 500,32 C460,38 435,60 420,86 C408,106 372,106 360,86 C348,60 320,38 280,34 C240,30 205,46 180,72 C165,86 135,86 120,72 C100,50 60,42 0,54" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round" filter="url(#postSoft)" vector-effect="non-scaling-stroke"/>
  </svg>
</div>

<main>
    <h1>写真・日記を投稿</h1>
    <form id="form">
        <label for="photo">写真</label>
        <input type="file" id="photo" accept="image/*">
        <img id="preview" alt="" style="width:100%;margin-top:8px;display:none;border-radius:8px">
        <label for="text">日記</label>
        <textarea id="text" required></textarea>
        <p class="error" id="error"></p>
        <button class="btn" id="submit-button" type="submit">投稿する</button>
    </form>
    <a class="btn sub" href="home.html">ホームに戻る</a>
</main>
<script src="app.js"></script>
<script>
requireLogin();
let photoData = null;

// localStorage の容量(約5MB)対策で、縮小してJPEGに変換して保存する
function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 800 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = img.width * scale;
      cv.height = img.height * scale;
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(img.src);
      resolve(cv.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

photo.addEventListener('change', async () => {
  const file = photo.files[0];
  if (!file) { photoData = null; preview.style.display = 'none'; return; }
  try {
    photoData = await shrink(file);
    preview.src = photoData;
    preview.style.display = 'block';
  } catch {
    error.textContent = '画像を読み込めませんでした';
  }
});

let isSubmitting = false;

form.addEventListener('submit', (e) => {
  e.preventDefault();
  if (isSubmitting) return;
  isSubmitting = true;
  submitButton.disabled = true;

  try {
    addPost({ user: getCurrentName(), text: text.value, photo: photoData, date: Date.now() });
  } catch {
    isSubmitting = false;
    submitButton.disabled = false;
    error.textContent = '保存に失敗しました(容量オーバーの可能性)';
    return;
  }
  location.href = 'home.html';
});
</script>
</body>
</html>
