<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ピク日記 - ログイン</title>
  <link rel="stylesheet" href="css/login.css">
  <!-- ポップなフォント（Google Fonts）の読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- 右上の新規登録ボタン -->
<header class="top-nav">
  <button
    id="nav-toggle-btn"
    class="nav-signup-btn"
    onclick="location.href='signup.html'">
    新規登録
  </button>
</header>


<!-- 🍫 上部：茶色の帯＋垂れるチョコ -->
<div class="home-header">
  <div class="choco-bar">
    <div class="header-content"></div>
  </div>

  <svg
    class="choco-drip"
    viewBox="0 0 1200 160"
    preserveAspectRatio="none"
    aria-hidden="true"
  >
    <defs>
      <linearGradient id="chocoBody" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="160">
        <stop offset="0"    stop-color="#684a3b"/>
        <stop offset="0.45" stop-color="#5a3a2a"/>
        <stop offset="1"    stop-color="#3a1b0e"/>
      </linearGradient>
      <filter id="soft" x="-10%" y="-50%" width="120%" height="200%">
        <feGaussianBlur stdDeviation="1.5"/>
      </filter>
      <filter id="shadow" x="-5%" y="0%" width="110%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#3a1b0e" flood-opacity="0.35"/>
      </filter>
    </defs>

    <!-- 本体 -->
    <g filter="url(#shadow)">
      <path fill="url(#chocoBody)" d="
        M0,0 L1200,0 L1200,40
        C1170,50 1140,46 1115,40
        C1085,32 1070,45 1060,70
        C1052,95 1018,95 1010,70
        C1000,45 980,32 940,38
        C900,44 875,70 860,100
        C850,125 810,125 800,100
        C790,70 770,44 730,38
        C690,32 665,44 650,68
        C638,92 612,92 600,68
        C580,44 540,32 500,38
        C460,44 435,66 420,92
        C408,115 372,115 360,92
        C348,66 320,44 280,40
        C240,36 205,52 180,78
        C165,95 135,95 120,78
        C100,56 60,48 0,60
        Z"/>
    </g>
    <!-- つや：縁の少し内側をなぞる細い光 -->
    <path d="M1200,34 C1170,44 1140,40 1115,34
            C1085,26 1070,39 1060,64
            C1052,86 1018,86 1010,64
            C1000,39 980,26 940,32
            C900,38 875,64 860,94
            C850,116 810,116 800,94
            C790,64 770,38 730,32
            C690,26 665,38 650,62
            C638,84 612,84 600,62
            C580,38 540,26 500,32
            C460,38 435,60 420,86
            C408,106 372,106 360,86
            C348,60 320,38 280,34
            C240,30 205,46 180,72
            C165,86 135,86 120,72
            C100,50 60,42 0,54"
          fill="none" stroke="#fff" stroke-opacity="0.22"
          stroke-width="2" stroke-linecap="round" filter="url(#soft)"
          vector-effect="non-scaling-stroke"/>
  </svg>
 
</div>

  <!-- メインコンテンツ -->
  <main class="login-container">
    
    <!-- ロゴ部分 (チョコプレート風デザイン) -->
    <div class="logo-plate">
      <div class="logo-inner">
        <span class="logo-sub">絵日記アプリ</span>
        <h1 class="logo-title">
          <span class="char">ピ</span>
          <span class="char">ク</span>
          <span class="char">日</span>
          <span class="char">記</span>
        </h1>
        <div class="logo-deco">✨ 🍓 ✨</div>
      </div>
    </div>

    <!-- 板チョコモチーフのカード -->
    <div class="choco-card">
      <div class="choco-grid">
        <div class="choco-piece"></div>
        <div class="choco-piece"></div>
        <div class="choco-piece"></div>
        <div class="choco-piece"></div>
      </div>

      <!-- 1. ログインフォーム -->
      <div id="login-section" class="form-section active">
        <h2 class="card-title">ログイン</h2>
        <form class="login-form" onsubmit="loginSubmit(event)">
          <div class="input-group">
            <label for="login-email">メールアドレス</label>
            <input type="email" id="login-email" placeholder="example@pikunikki.com" required>
          </div>

          <div class="input-group">
            <label for="login-password">パスワード</label>
            <input type="password" id="login-password" placeholder="••••••••" required>
          </div>

          <button type="submit" class="submit-btn">ログイン</button>
        </form>

        <div class="card-footer">
          <a href="signup.html">新規登録はこちら</a>
          <span>•</span>
          <a href="#">パスワードを忘れた方</a>
        </div>

      </div>

      <!-- 2. 新規登録フォーム -->
      <div id="signup-section" class="form-section">
        <h2 class="card-title">新規登録</h2>
        <form class="login-form" onsubmit="event.preventDefault(); alert('アカウントを作成しました！');">
          <div class="input-group">
            <label for="signup-name">ニックネーム</label>
            <input type="text" id="signup-name" placeholder="ぴくちゃん" required>
          </div>

          <div class="input-group">
            <label for="signup-email">メールアドレス</label>
            <input type="email" id="signup-email" placeholder="example@pikunikki.com" required>
          </div>

          <div class="input-group">
            <label for="signup-password">パスワード</label>
            <input type="password" id="signup-password" placeholder="8文字以上" required>
          </div>

          <button type="submit" class="submit-btn signup-theme">新規登録する 🍫</button>
        </form>

        <div class="card-footer">
          <a href="#" onclick="toggleForm(); return false;">すでにアカウントをお持ちの方</a>
        </div>
      </div>

    </div>

  </main>

  <script src="app.js"></script>
  <!-- 切り替え用JavaScript -->
  <script>
    function toggleForm() {
      const loginSection = document.getElementById('login-section');
      const signupSection = document.getElementById('signup-section');
      const navBtn = document.getElementById('nav-toggle-btn');

      if (loginSection.classList.contains('active')) {
        loginSection.classList.remove('active');
        signupSection.classList.add('active');
        navBtn.textContent = 'ログイン';
      } else {
        signupSection.classList.remove('active');
        loginSection.classList.add('active');
        navBtn.textContent = '新規登録';
      }
    }
  </script>
</body>
</html>
